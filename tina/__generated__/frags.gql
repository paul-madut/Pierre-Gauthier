fragment PostParts on Post {
  __typename
  title
  date
  author
  excerpt
  featuredImage
  body
}

fragment TestimonialParts on Testimonial {
  __typename
  name
  location
  quote
  metric
  rating
  order
  featured
}

fragment ProjectParts on Project {
  __typename
  title
  date
  location
  excerpt
  featuredImage
  beforeImages {
    __typename
    image
    caption
  }
  afterImages {
    __typename
    image
    caption
  }
  body
}
